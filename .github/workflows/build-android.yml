name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install MAUI Android workload
      run: dotnet workload install maui-android --skip-manifest-update

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Android APK
      run: dotnet build -f net10.0-android -c Release -p:AndroidSdkDirectory=$ANDROID_HOME

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: UtauTtsBuilder-APK
        path: |
          bin/Release/net10.0-android/*.apk
          bin/Release/net10.0-android/publish/*.apk
        if-no-files-found: warn
