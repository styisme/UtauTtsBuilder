name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract version from CHANGELOG
      id: ver
      run: |
        VERSION=$(grep -oP '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -n1 | sed 's/^## \[//;s/\]$//' || true)
        if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
        BUILD=$(date +%Y%m%d)
        echo "Version: $VERSION (build $BUILD)"
        echo "display=$VERSION" >> $GITHUB_OUTPUT
        echo "code=$BUILD" >> $GITHUB_OUTPUT

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Setup Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install MAUI Android workload
      run: dotnet workload install maui-android --source https://api.nuget.org/v3/index.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Android APK
      run: |
        dotnet build -f net10.0-android -c Release \
          -p:ApplicationDisplayVersion=${{ steps.ver.outputs.display }} \
          -p:ApplicationVersion=${{ steps.ver.outputs.code }}

    - name: Rename APK with version
      run: |
        mkdir -p artifacts
        for f in bin/Release/net10.0-android/*.apk; do
          [ -e "$f" ] || continue
          base=$(basename "$f" .apk)
          cp "$f" "artifacts/${base}-v${{ steps.ver.outputs.display }}.apk"
        done

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: UtauTtsBuilder-APK
        path: artifacts/*.apk
        if-no-files-found: warn
