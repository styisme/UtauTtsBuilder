name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # 强制告诉系统 Android SDK 的位置，省去 Setup Android SDK 步骤
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Setup Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install MAUI Android workload
      run: dotnet workload install maui-android --source https://api.nuget.org/v3/index.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Android APK
      run: dotnet build -f net10.0-android -c Release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: UtauTtsBuilder-APK
        path: |
          bin/Release/net10.0-android/*.apk
          bin/Release/net10.0-android/publish/*.apk
        if-no-files-found: warn